name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Build and pack dry-run artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run package:smoke
      - run: npm run pack:check
      - name: Create local package artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts --json > artifacts/npm-pack.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vb-audio-mcp-release-dry-run
          path: artifacts/
          if-no-files-found: error
