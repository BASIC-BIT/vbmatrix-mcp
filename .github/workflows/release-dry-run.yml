name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Build and pack dry-run artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run package:smoke
      - run: npm run pack:check
      - name: Create local package artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts --json > artifacts/npm-pack.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vb-audio-mcp-release-dry-run
          path: artifacts/
          if-no-files-found: error
